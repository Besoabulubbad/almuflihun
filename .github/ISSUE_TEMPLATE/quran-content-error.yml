name: Quran content error
description: A verse is wrong, cut, mis-referenced, or a quote is not inside its verse. Fixed first.
title: "content: "
labels: ["content", "priority: high"]
body:
  - type: input
    id: where
    attributes:
      label: Where in the app
      description: Screen and section, e.g. الأبواب → الإنفاق → كم؟
    validations:
      required: true
  - type: input
    id: ref
    attributes:
      label: Verse reference
      description: surah:ayah, e.g. 2:219
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: What the app shows, and what the Mushaf says.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → عن التطبيق → الإصدار
