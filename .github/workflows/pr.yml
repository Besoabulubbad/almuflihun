# The pull-request gate (ADR 0011): static analysis → architecture and unit tests → dependency health → the APK the
# owner hands out (`direct` flavour, ADR 0010). iOS compiles in a parallel macOS job.
name: PR checks

on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify (Android + JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The free runner has ~14 GB free; drop preinstalled toolchains this project never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Static analysis (detekt, including the design and Quran rules)
        run: ./gradlew detekt --continue

      - name: Architecture and unit tests · dependency health · direct and play APKs
        run: ./gradlew check buildHealth :app:android:assembleDirectDebug :app:android:assemblePlayDebug --continue

      - name: Test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: "**/build/test-results/**/*.xml"
          check_name: Test results
          detailed_summary: true

  ios:
    name: iOS framework and app (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The Kotlin/Native toolchain and its caches are most of a cold run; keep them between runs.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test --continue

      # By target: the scheme is per-user (not committed), and a target build needs no simulator destination.
      - name: Build the iOS app for the simulator
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -configuration Debug \
            -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO build
