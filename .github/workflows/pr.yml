# The pull-request gate (ADR 0011): static analysis → architecture and unit tests → dependency health → the APK the
# owner hands out (`direct` flavour, ADR 0010). iOS runs in pr-ios.yml when iOS-relevant code changes.
name: PR checks

on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify (Android + JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The free runner has ~14 GB free; drop preinstalled toolchains this project never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ADR 0013: QPC page fonts come from Quran Foundation at runtime and must never be committed.
      - name: No Mushaf page fonts in the repository
        run: |
          if git ls-files | grep -E "(^|/)(p[0-9]{1,3}|QCF[0-9_]*P?[0-9]{1,3})\.(ttf|otf|woff2?)$"; then
            echo "::error::QPC page fonts must not be committed (ADR 0013)"; exit 1
          fi

      - name: Static analysis (detekt, including the design and Quran rules)
        run: ./gradlew detekt --continue

      - name: Architecture and unit tests · dependency health · direct and play APKs
        run: ./gradlew check buildHealth :app:android:assembleDirectDebug :app:android:assemblePlayDebug --continue

      - name: Test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: "**/build/test-results/**/*.xml"
          check_name: Test results
          detailed_summary: true

